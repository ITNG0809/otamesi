<symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>

<header>
<button id="play" class="ib sq" data-tip="再生 / 一時停止" data-key="Space" aria-label="再生 / 一時停止" data-toggle="1"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button><button id="stop" class="ib sq" data-tip="停止(先頭へ戻る)" aria-label="停止(先頭へ戻る)"><svg class="ic" aria-hidden="true"><use href="#i-square"/></svg></button><button id="rew" class="ib sq" data-tip="先頭へ戻る" aria-label="先頭へ戻る"><svg class="ic" aria-hidden="true"><use href="#i-skip-back"/></svg></button>
<span id="pos" data-tip="再生位置(小節:拍)">1:1</span>
<span id="mtw" data-tip="マスター出力レベル(赤くなるとクリップ)" style="display:inline-block;width:64px;height:8px;background:var(--line);border-radius:4px;overflow:hidden"><i id="mt" style="display:block;height:100%;width:0;background:var(--acc)"></i></span><b id="clip" style="color:#e5484d;font-size:12px;cursor:pointer" data-tip="クリックで解除"></b>
<label class="hl">BPM <input id="bpm" type="number" min="40" max="240" value="120" aria-label="BPM"></label>
<label class="hl">Master <input id="mvol" type="range" min="0" max="1.5" step=".01" value=".8" aria-label="マスターボリューム" style="width:84px"></label>
<button id="loop" class="ib sq on" data-tip="ループ再生" aria-label="ループ再生" data-toggle="1"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button><button id="blockPlay" class="ib sq" data-tip="選択中のソングブロックだけ再生" aria-label="ブロック内を再生"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button><span class="sep"></span>
<span class="seg"><button id="vSong" data-tip="ソング画面(曲全体の配置)" aria-label="ソング画面">ソング</button><button id="vRoll" class="on" data-tip="ピアノロール画面(音符の編集)" aria-label="ピアノロール画面">ピアノロール</button></span><span class="sep"></span>
<button id="undo" class="ib sq" data-tip="元に戻す" data-key="Ctrl/⌘+Z" aria-label="元に戻す"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg></button><button id="redo" class="ib sq" data-tip="やり直す" data-key="Ctrl/⌘+Shift+Z" aria-label="やり直す"><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg></button><span class="sep"></span>
<label class="hl" style="display:flex;align-items:center;gap:5px">作品名 <input id="projectName" type="text" value="BGM" maxlength="100" style="width:140px;min-height:36px" aria-label="作品名"></label><button id="save" class="ib sq" data-tip="プロジェクトを保存(ブラウザ内)" aria-label="プロジェクトを保存(ブラウザ内)"><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg></button><button id="exp" class="ib lbl" data-tip="プロジェクトをJSONで書き出す" aria-label="プロジェクトをJSONで書き出す"><svg class="ic" aria-hidden="true"><use href="#i-file-down"/></svg><span class="lb">JSON</span></button><button id="imp" class="ib lbl" data-tip="プロジェクトをJSONから読み込む" aria-label="プロジェクトをJSONから読み込む"><svg class="ic" aria-hidden="true"><use href="#i-file-up"/></svg><span class="lb">JSON</span></button><button id="reset" class="ib sq danger" data-tip="プロジェクトをリセット(初期状態に戻す)" aria-label="プロジェクトをリセット(初期状態に戻す)"><svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg></button><span class="sep"></span>
<button id="sf2b" class="ib lbl sf2-button" data-tip="SF2音源ファイルを読み込む(複数可)" aria-label="SF2音源ファイルを読み込む(複数可)"><span class="sf2-badge" aria-hidden="true">SF2</span><span class="lb">音源を追加</span></button><button id="sflB" class="ib lbl sf2-button" data-tip="SF2ライブラリを開く" aria-label="SF2ライブラリを開く"><span class="sf2-badge" aria-hidden="true">SF2</span><span class="lb">音源ライブラリ</span></button><span class="sep"></span>
<select id="sr" aria-label="サンプルレート" data-tip="サンプルレート(書き出し用)"><option value="44100">44.1kHz</option><option value="48000">48kHz</option></select><button id="wav" class="ib sq" data-tip="ダウンロード(音声の書き出し)" aria-label="ダウンロード(音声の書き出し)"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></button><button id="mexp" class="ib lbl" data-tip="MIDIファイルとして書き出す" aria-label="MIDIファイルとして書き出す"><svg class="ic" aria-hidden="true"><use href="#i-file-down"/></svg><span class="lb">MIDI</span></button><button id="mimp" class="ib lbl" data-tip="MIDIファイルを読み込む" aria-label="MIDIファイルを読み込む"><svg class="ic" aria-hidden="true"><use href="#i-file-up"/></svg><span class="lb">MIDI</span></button>
<span id="st">読み込み中…</span>
</header>
<main>
<aside><div class="aact"><button id="add" class="ib lbl" data-tip="トラックを追加" aria-label="トラックを追加"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span class="lb">トラック</span></button><button id="addA" class="ib lbl" data-tip="音声ファイルを読み込む(SE)" aria-label="音声ファイルを読み込む(SE)"><svg class="ic" aria-hidden="true"><use href="#i-music"/></svg><span class="lb">音声</span></button></div><div id="tl"></div><div id="atl"></div></aside>
<div id="rc"><div id="rt"><div id="roll"><div id="sz"><canvas id="cv"></canvas></div></div>
<div id="vs"><div id="vsT"></div></div></div>
<div id="alw"><canvas id="al"></canvas></div>
<div id="vlw"><canvas id="vl"></canvas></div></div>
</main>
<div id="hs"><div id="hsT"></div><i id="hsP"></i></div>
<div class="bar2" id="abar" style="display:none"><b id="ainfo"></b><span class="sep"></span><span id="atools" class="anl"><button class="atl" data-t="sel" title="選択ツール">選択</button><button class="atl" data-t="add" title="制御点追加ツール">追加</button><button class="atl" data-t="del" title="制御点削除ツール">削除</button><button class="atl" data-t="line" title="直線描画ツール">直線</button><button class="atl" data-t="free" title="自由描画ツール">自由描画</button></span><b id="atoolName" style="font-weight:600"></b><span class="sep"></span><input id="an" aria-label="クリップ名" style="width:110px;min-height:32px"><span>接続先</span><select id="atg" aria-label="接続先パラメータ" style="max-width:240px"></select><button id="atUn" title="接続を解除">接続解除</button><span class="anl">補間</span><select class="anl" id="aint" aria-label="補間方式"><option value="step">ステップ</option><option value="linear">線形</option><option value="smooth">滑らか(Hermite)</option></select><span class="anl">選択点の区間</span><select class="anl" id="aseg" aria-label="選択した制御点から次の点までの補間"><option value="">区間補間…</option><option value="step">ステップ</option><option value="linear">線形</option><option value="smooth">滑らか</option><option value="">クリップ設定に従う</option></select><span class="acv">滑らかさ</span><input class="acv" id="asm" type="range" min="0" max="1" step=".05" style="width:90px;min-height:24px"><span class="apt">範囲±半音</span><input class="apt" id="arng" type="number" min="1" max="48" style="width:60px;min-height:32px;padding:2px 6px"><span class="aeo">遅延(秒)</span><input class="aeo" id="atm" type="number" step=".05" min=".02" max="1" style="width:64px;min-height:32px;padding:2px 6px"><span class="aeo">フィードバック</span><input class="aeo" id="afb" type="number" step=".05" min="0" max=".85" style="width:64px;min-height:32px;padding:2px 6px">
